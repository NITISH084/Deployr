<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Deployr logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1B14"/>
      <stop offset="1" stop-color="#170F0B"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="52" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset="0.5" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E8431A"/>
    </linearGradient>
    <!-- Horizontal slices that widen toward the bottom: layers of the pipeline, a sun coming up -->
    <mask id="slices" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <rect x="0" y="130" width="256" height="4" fill="#000"/>
      <rect x="0" y="146" width="256" height="6" fill="#000"/>
      <rect x="0" y="164" width="256" height="8" fill="#000"/>
      <rect x="0" y="182" width="256" height="20" fill="#000"/>
    </mask>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <circle cx="128" cy="124" r="72" fill="url(#sun)" mask="url(#slices)"/>
</svg>
